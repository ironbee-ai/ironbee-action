name: 'IronBee Action'
description: 'Verify and fix code changes using IronBee CLI + Claude Code'
author: 'IronBee'

branding:
  icon: 'shield'
  color: 'orange'

inputs:
  # ── Where the verification runs ────────────────────────────────────
  verification_mode:
    description: >-
      Where the verification runs. "platform" starts a verification job on the
      IronBee platform and follows it; "local" runs the agent on this runner
      with your own Anthropic credential; "auto" picks platform for a public
      repository, and local for a private one when an Anthropic credential is
      set (set "platform" explicitly if the IronBee GitHub App covers it).
    required: false
    default: 'auto'

  # ── IronBee — auth & collector ─────────────────────────────────────
  ironbee_api_key:
    description: 'IronBee API key (used to authenticate the collector)'
    required: true
  ironbee_collector_url:
    description: 'IronBee collector endpoint URL'
    required: false
    default: 'https://collector.service.ironbee.ai'

  # ── IronBee — Console report links ─────────────────────────────────
  ironbee_console_url:
    description: 'IronBee Console hostname (without scheme) used to build session links in the report'
    required: false
    default: 'console.ironbee.ai'
  ironbee_api_url:
    description: 'IronBee API base URL. Leave empty to use the CLI default.'
    required: false
    default: ''
  bind_repository:
    description: >-
      Bind the run to the repository so the agent reads the changeset. Turn it
      off to verify the application without repository context — which is what a
      private repository the IronBee GitHub App does not cover needs.
    required: false
    default: 'true'
  ironbee_project:
    description: 'Project the results attach to. Leave empty to derive it from the git remote.'
    required: false
    default: ''
  job_timeout_minutes:
    description: 'Run timeout for a platform verification job. Leave empty to use the API default.'
    required: false
    default: ''

  # ── IronBee — DevTools modes (per-platform enable flags) ───────────
  ironbee_browser_devtools:
    description: 'Enable browser DevTools verification (browser MCP)'
    required: false
    default: 'true'
  ironbee_backend_devtools:
    description: 'Enable backend DevTools verification (backend MCP)'
    required: false
    default: 'false'
  ironbee_node_devtools:
    description: 'Enable Node.js DevTools verification (node MCP)'
    required: false
    default: 'false'

  # ── IronBee — raw config escape hatch ──────────────────────────────
  ironbee_extra_config:
    description: 'Raw IronBee config as a JSON string. Deep-merged into the generated .ironbee/config.json (user keys win over defaults).'
    required: false
    default: ''

  # ── IronBee — CLI install / repo behavior ──────────────────────────
  ironbee_cli_version:
    description: 'IronBee CLI version to install (e.g., "0.4.1", "latest")'
    required: false
    default: 'latest'
  ironbee_exclude_files:
    description: 'Exclude IronBee config files from commits (set true to prevent .ironbee/, .claude/, .mcp.json from being committed)'
    required: false
    default: 'false'

  # ── Claude Code — auth ─────────────────────────────────────────────
  anthropic_api_key:
    description: 'Anthropic API key for Claude Code'
    required: false
  claude_code_oauth_token:
    description: 'Claude Code OAuth token (alternative to API key)'
    required: false

  # ── Claude Code — install & runtime ────────────────────────────────
  claude_code_cli_version:
    description: 'Claude Code CLI version to install (e.g., "1.0.0", "latest")'
    required: false
    default: 'latest'
  model:
    description: 'Claude model to use (e.g., "claude-sonnet-4-5-20250514")'
    required: false
    default: ''
  max_turns:
    description: 'Maximum conversation turns for Claude Code'
    required: false
    default: '100'
  prompt:
    description: 'Additional instructions for the verification agent'
    required: false
    default: ''
  claude_args:
    description: 'Additional Claude Code CLI arguments'
    required: false
    default: ''

  # ── Fixing what the verification finds ─────────────────────────────
  fix:
    description: 'Fix the issues a failing verification reports. Needs an Anthropic credential.'
    required: false
    default: 'true'

  # ── Application under test ─────────────────────────────────────────
  app_install_command:
    description: 'Command to install application dependencies (e.g., "npm ci")'
    required: false
    default: ''
  app_build_command:
    description: 'Command to build the application before verification (e.g., "npm run build")'
    required: false
    default: ''
  app_start_command:
    description: 'Command to start the application (e.g., "npm run dev")'
    required: false
    default: ''
  app_url:
    description: 'Application URL for browser verification (e.g., "http://localhost:3000")'
    required: false
    default: ''
  app_port:
    description: >-
      Local port the application listens on. Used when the application runs on
      this runner and is reached through a reverse tunnel — either because
      app_url points at localhost, or because only app_start_command is set.
    required: false
    default: '3000'
  app_wait_seconds:
    description: 'How long to wait for the local application to accept connections. Empty uses the CLI default.'
    required: false
    default: ''
  app_headers:
    description: 'Request headers for a deployed URL, one per line as "Name: value". Non-secret values only.'
    required: false
    default: ''
  app_secret_headers:
    description: >-
      Request headers whose values are secret — a deployment-protection bypass,
      an environment token. One "Name: value" per line, from a GitHub secret.
      Encrypted by the service and never read back.
    required: false
    default: ''

  # ── GitHub ─────────────────────────────────────────────────────────
  github_token:
    description: 'GitHub token for PR operations'
    required: false
    default: ${{ github.token }}

  # ── Action — general behavior ──────────────────────────────────────
  working_directory:
    description: 'Working directory for verification'
    required: false
    default: '.'
  verbose:
    description: 'Enable verbose logging (tool responses, prompt, artifact list, verdict details)'
    required: false
    default: 'false'

outputs:
  verdict:
    description: 'Verification verdict (pass / fail / not_applicable / unknown)'
    value: ${{ steps.plan.outputs.mode != 'platform' && steps.verdict.outputs.status || steps.job-reverified.outputs.verdict || steps.job.outputs.verdict }}
  mode:
    description: 'Where the verification ran (platform / local)'
    value: ${{ steps.plan.outputs.mode }}
  job_id:
    description: 'Verification job id — platform mode only; the last job when a fix was re-verified'
    value: ${{ steps.job-reverified.outputs.job_id || steps.job.outputs.job_id }}
  job_url:
    description: 'IronBee Console link for the run — platform mode only, and only once the job claimed an attempt'
    value: ${{ steps.job-reverified.outputs.job_url || steps.job.outputs.job_url }}
  artifacts_url:
    description: 'Download URL for verification evidence — local mode only; platform evidence lives in the Console'
    value: ${{ steps.upload-artifacts.outputs.artifact-url }}

runs:
  using: 'composite'
  steps:
    # ── Setup ──────────────────────────────────────────────────────────
    - name: Fetch git history for diff
      shell: bash
      run: |
        # Unshallow so git diff / git log always work (even single-commit repos)
        git fetch --unshallow origin 2>/dev/null || true
        git fetch origin ${{ github.event.pull_request.base.ref || '' }} --depth=50 2>/dev/null || true

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    # ── Decide what runs, and where ────────────────────────────────────
    #
    # Every decision the action makes lives in one script so it can be tested:
    # the mode, the target, the repository binding, the flags. This step reads
    # the answers and nothing else. It runs before any install, so a workflow
    # that cannot run costs one Node startup rather than a Chromium download.
    - name: Resolve the verification plan
      id: plan
      shell: bash
      env:
        INPUT_VERIFICATION_MODE: ${{ inputs.verification_mode }}
        INPUT_IRONBEE_API_KEY: ${{ inputs.ironbee_api_key }}
        INPUT_ANTHROPIC_API_KEY: ${{ inputs.anthropic_api_key }}
        INPUT_CLAUDE_CODE_OAUTH_TOKEN: ${{ inputs.claude_code_oauth_token }}
        INPUT_APP_URL: ${{ inputs.app_url }}
        INPUT_APP_START_COMMAND: ${{ inputs.app_start_command }}
        INPUT_APP_PORT: ${{ inputs.app_port }}
        INPUT_APP_WAIT_SECONDS: ${{ inputs.app_wait_seconds }}
        INPUT_APP_HEADERS: ${{ inputs.app_headers }}
        INPUT_APP_SECRET_HEADERS: ${{ inputs.app_secret_headers }}
        INPUT_IRONBEE_PROJECT: ${{ inputs.ironbee_project }}
        INPUT_BIND_REPOSITORY: ${{ inputs.bind_repository }}
        INPUT_JOB_TIMEOUT_MINUTES: ${{ inputs.job_timeout_minutes }}
        INPUT_FIX: ${{ inputs.fix }}
        INPUT_MODEL: ${{ inputs.model }}
        INPUT_MAX_TURNS: ${{ inputs.max_turns }}
        INPUT_CLAUDE_ARGS: ${{ inputs.claude_args }}
        INPUT_IRONBEE_BROWSER_DEVTOOLS: ${{ inputs.ironbee_browser_devtools }}
        INPUT_IRONBEE_BACKEND_DEVTOOLS: ${{ inputs.ironbee_backend_devtools }}
        INPUT_IRONBEE_NODE_DEVTOOLS: ${{ inputs.ironbee_node_devtools }}
        REPOSITORY_PRIVATE: ${{ github.event.repository.private }}
        IS_FORK: ${{ github.event.pull_request.head.repo.fork }}
        EVENT_NAME: ${{ github.event_name }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        COMMIT_SHA: ${{ github.sha }}
        BEFORE_SHA: ${{ github.event.before }}
      working-directory: ${{ inputs.working_directory }}
      run: |
        # The base of a push is a SHA this checkout may not have: the first push
        # of a branch reports all zeros, and a force-push can name a commit that
        # is gone. Both are forty hex characters and would pass every shape
        # check on the way to failing at the platform's own checkout, so the
        # question is answered here, where git can answer it.
        BASE_USABLE=false
        if [ -n "$BEFORE_SHA" ] && git cat-file -e "${BEFORE_SHA}^{commit}" 2>/dev/null; then
          BASE_USABLE=true
        fi
        export BASE_USABLE

        node "${{ github.action_path }}/scripts/resolve-plan.js"

    # ── Preflight: refuse what cannot work, before installing anything ─
    - name: Check the deployment is reachable
      if: steps.plan.outputs.target_kind == 'url'
      shell: bash
      env:
        APP_URL: ${{ inputs.app_url }}
      run: |
        STATUS=$(curl -o /dev/null -s -w '%{http_code}' --max-time 15 -L "$APP_URL" || echo "000")

        if [ "$STATUS" = "401" ] || [ "$STATUS" = "403" ]; then
          echo "::error::$APP_URL answers $STATUS — it is behind deployment protection."
          echo "::error::The verification would report on the login page rather than on the application."
          echo "::error::Verify the application on this runner instead: set app_start_command and app_port, and leave app_url empty."
          exit 1
        fi

        # A connection failure is not a refusal. This runner and the IronBee
        # platform dial from different networks, so "unreachable from here" says
        # nothing about whether the run can reach it.
        if [ "$STATUS" = "000" ]; then
          echo "::warning::$APP_URL did not answer from this runner. The verification runs from elsewhere and may still reach it."
        else
          echo "$APP_URL answers $STATUS"
        fi

    - name: Restore Playwright browser cache
      id: playwright-cache
      if: steps.plan.outputs.mode == 'local'
      uses: actions/cache@v4
      with:
        path: ~/.cache/ms-playwright
        key: playwright-chromium-${{ runner.os }}
        restore-keys: playwright-chromium-${{ runner.os }}
        save-always: true

    # ── Install IronBee CLI ────────────────────────────────────────────
    - name: Install IronBee CLI
      shell: bash
      run: |
        # Resolve "latest" via `npm view` so the install pins to an explicit
        # version — avoids any dist-tag / CDN cache surprises that can make
        # `npm install -g @ironbee-ai/cli` silently pull an older release.
        if [ "${{ inputs.ironbee_cli_version }}" = "latest" ]; then
          VERSION="$(npm view @ironbee-ai/cli version)"
        else
          VERSION="${{ inputs.ironbee_cli_version }}"
        fi
        echo "Installing @ironbee-ai/cli@${VERSION}"
        npm install -g "@ironbee-ai/cli@${VERSION}"
        INSTALLED="$(ironbee --version)"
        echo "Installed @ironbee-ai/cli version: ${INSTALLED}"
        echo "ironbee-version=${INSTALLED}" >> "$GITHUB_OUTPUT"
        echo "ironbee-path=$(which ironbee)" >> "$GITHUB_OUTPUT"
      id: install-cli

    - name: Configure IronBee
      if: steps.plan.outputs.mode == 'local'
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      env:
        IRONBEE_COLLECTOR_URL: ${{ inputs.ironbee_collector_url }}
        BROWSER_DEVTOOLS_ENABLE: ${{ inputs.ironbee_browser_devtools }}
        BACKEND_DEVTOOLS_ENABLE: ${{ inputs.ironbee_backend_devtools }}
        NODE_DEVTOOLS_ENABLE: ${{ inputs.ironbee_node_devtools }}
        EXTRA_CONFIG: ${{ inputs.ironbee_extra_config }}
      run: |
        mkdir -p .ironbee/artifacts
        ARTIFACTS_DIR="$(pwd)/.ironbee/artifacts" node -e '
          const fs = require("fs");
          const dir = process.env.ARTIFACTS_DIR;
          const toBool = (v) => /^(true|1|yes|on)$/i.test(String(v || "").trim());
          const config = {
            collector: {
              url: process.env.IRONBEE_COLLECTOR_URL,
            },
            // Cycle gating — drives whether the per-platform MCP server is
            // registered in .mcp.json by `ironbee install`.
            browser: { enable: toBool(process.env.BROWSER_DEVTOOLS_ENABLE) },
            backend: { enable: toBool(process.env.BACKEND_DEVTOOLS_ENABLE) },
            node:    { enable: toBool(process.env.NODE_DEVTOOLS_ENABLE) },
            // MCP env (LOG_FILE etc.) merged into each MCP server entry by
            // the CLI when the corresponding cycle is enabled above.
            browserDevTools: {
              env: {
                LOG_FILE: dir + "/ironbee-browser-devtools-mcp.log",
                // GitHub-hosted Linux runners reject user-namespace sandboxing;
                // launch Chromium with --no-sandbox or it dies on first navigate
                // with "Target page, context or browser has been closed".
                BROWSER_CHROMIUM_SANDBOX: "false",
              },
            },
            backendDevTools: {
              env: { LOG_FILE: dir + "/ironbee-backend-devtools-mcp.log" },
            },
            nodeDevTools: {
              env: { LOG_FILE: dir + "/ironbee-node-devtools-mcp.log" },
            },
          };
          const extra = (process.env.EXTRA_CONFIG || "").trim();
          if (extra) {
            let parsed;
            try { parsed = JSON.parse(extra); }
            catch (e) {
              console.error("::error::ironbee_extra_config is not valid JSON: " + e.message);
              process.exit(1);
            }
            const merge = (target, source) => {
              for (const key of Object.keys(source)) {
                const sv = source[key];
                if (sv && typeof sv === "object" && !Array.isArray(sv)) {
                  if (!target[key] || typeof target[key] !== "object" || Array.isArray(target[key])) {
                    target[key] = {};
                  }
                  merge(target[key], sv);
                } else {
                  target[key] = sv;
                }
              }
              return target;
            };
            merge(config, parsed);
          }
          fs.writeFileSync(".ironbee/config.json", JSON.stringify(config, null, 2));
        '

    - name: Setup IronBee for Claude
      if: steps.plan.outputs.mode == 'local'
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      env:
        IRONBEE_API_KEY: ${{ inputs.ironbee_api_key }}
      run: |
        if [ "${{ inputs.ironbee_exclude_files }}" = "true" ]; then
          echo ".mcp.json" >> .git/info/exclude
          echo ".ironbee/" >> .git/info/exclude
          echo ".claude/settings.json" >> .git/info/exclude
          echo ".claude/skills/ironbee-*.md" >> .git/info/exclude
          echo ".claude/rules/ironbee-*.md" >> .git/info/exclude
          echo ".claude/commands/ironbee-*.md" >> .git/info/exclude
        fi

        ironbee install --client claude

    # ── Browser Setup ────────────────────────────────────────────────
    - name: Install IronBee DevTools
      if: steps.plan.outputs.mode == 'local'
      shell: bash
      env:
        PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 'true'
      run: |
        # Resolve "latest" via `npm view` so the install pins to an explicit
        # version — same rationale as for @ironbee-ai/cli above.
        VERSION="$(npm view @ironbee-ai/devtools version)"
        echo "Installing @ironbee-ai/devtools@${VERSION}"
        npm install -g "@ironbee-ai/devtools@${VERSION}"
        echo "Installed @ironbee-ai/devtools version: ${VERSION}"

    - name: Install Chromium and system dependencies
      if: steps.plan.outputs.mode == 'local'
      shell: bash
      run: npx -y playwright install --with-deps chromium ffmpeg

    # ── Build Verification Prompt ──────────────────────────────────────
    - name: Build verification prompt
      id: build-prompt
      if: steps.plan.outputs.mode == 'local'
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      env:
        USER_PROMPT: ${{ inputs.prompt }}
      run: |
        ARTIFACTS_DIR="$(pwd)/.ironbee/artifacts"

        # Determine trigger context and diff target
        DIFF_TARGET=""
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          CONTEXT="Pull Request #${{ github.event.pull_request.number }}: ${{ github.event.pull_request.title }}"
          DIFF_TARGET="origin/${{ github.event.pull_request.base.ref }}"
        elif [ "${{ github.event_name }}" = "push" ]; then
          CONTEXT="Push to ${{ github.ref_name }} (commit ${{ github.sha }})"
          if git rev-parse HEAD~1 >/dev/null 2>&1; then
            DIFF_TARGET="HEAD~1"
          else
            DIFF_TARGET="$(git hash-object -t tree /dev/null)"
          fi
        elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          CONTEXT="Manual run on ${{ github.ref_name }}"
        elif [ "${{ github.event_name }}" = "schedule" ]; then
          CONTEXT="Scheduled run on ${{ github.ref_name }}"
        else
          CONTEXT="${{ github.event_name }} on ${{ github.ref_name }}"
        fi

        # Build the prompt
        PROMPT=/tmp/ironbee-prompt.md
        if [ -n "$DIFF_TARGET" ]; then
          echo "You are running in CI. Verify the code changes and fix any issues found." > "$PROMPT"
        else
          echo "You are running in CI. Verify that the application is working correctly." > "$PROMPT"
        fi
        echo "" >> "$PROMPT"
        echo "## Context" >> "$PROMPT"
        echo "${CONTEXT}" >> "$PROMPT"
        if [ -n "$DIFF_TARGET" ]; then
          echo "Diff target: ${DIFF_TARGET}" >> "$PROMPT"
        fi

        # App configuration
        if [ -n "${{ inputs.app_install_command }}" ] || [ -n "${{ inputs.app_build_command }}" ] || [ -n "${{ inputs.app_start_command }}" ] || [ -n "${{ inputs.app_url }}" ]; then
          echo "" >> "$PROMPT"
          echo "## Application" >> "$PROMPT"
          if [ -n "${{ inputs.app_install_command }}" ]; then
            echo "- Install command: \`${{ inputs.app_install_command }}\`" >> "$PROMPT"
          fi
          if [ -n "${{ inputs.app_build_command }}" ]; then
            echo "- Build command: \`${{ inputs.app_build_command }}\`" >> "$PROMPT"
          fi
          if [ -n "${{ inputs.app_start_command }}" ]; then
            echo "- Start command: \`${{ inputs.app_start_command }}\`" >> "$PROMPT"
          fi
          if [ -n "${{ inputs.app_url }}" ]; then
            echo "- Application URL: ${{ inputs.app_url }}" >> "$PROMPT"
          fi
        fi

        # Evidence instructions
        echo "" >> "$PROMPT"
        echo "## Evidence" >> "$PROMPT"
        echo "Organize artifacts by verification cycle under: ${ARTIFACTS_DIR}/" >> "$PROMPT"
        echo "IMPORTANT: Each verification cycle gets ONE directory. Increment the cycle number for each new cycle." >> "$PROMPT"
        echo "  - Cycle 1 (fail + fix) = cycle-1/" >> "$PROMPT"
        echo "  - Cycle 2 (re-verify) = cycle-2/" >> "$PROMPT"
        echo "  Do NOT create multiple directories for the same cycle (e.g. cycle-1-fail AND cycle-1-pass)." >> "$PROMPT"
        echo "Directory structure:" >> "$PROMPT"
        echo "  ${ARTIFACTS_DIR}/cycle-<N>/screenshots/" >> "$PROMPT"
        echo "  ${ARTIFACTS_DIR}/cycle-<N>/recordings/" >> "$PROMPT"
        echo "Examples:" >> "$PROMPT"
        echo "  cycle-1/screenshots/homepage-before-fix.png" >> "$PROMPT"
        echo "  cycle-1/recordings/verification.webm" >> "$PROMPT"
        echo "  cycle-2/screenshots/homepage-after-fix.png" >> "$PROMPT"
        echo "  cycle-2/recordings/verification.webm" >> "$PROMPT"
        echo "Use descriptive file names that reflect what is being verified." >> "$PROMPT"

        # Append user's custom prompt
        if [ -n "$USER_PROMPT" ]; then
          echo "" >> "$PROMPT"
          echo "## Additional Instructions" >> "$PROMPT"
          printf "%s\n" "$USER_PROMPT" >> "$PROMPT"
        fi

        # Core instruction: run the IronBee verify command
        echo "" >> "$PROMPT"
        echo "## Task" >> "$PROMPT"
        if [ -n "$DIFF_TARGET" ]; then
          echo "1. Review the code changes: \`git diff ${DIFF_TARGET} --name-only\` and \`git diff ${DIFF_TARGET}\`" >> "$PROMPT"
          echo "   IMPORTANT: Do NOT use \`git diff HEAD~1\`. Always use \`${DIFF_TARGET}\` as the diff target." >> "$PROMPT"
          echo "2. Run /ironbee-verify to perform verification" >> "$PROMPT"
          echo "3. If verification fails, fix the issues and re-verify" >> "$PROMPT"
          echo "Do not commit, push, or open a pull request — that is handled for you." >> "$PROMPT"
        else
          echo "1. Run /ironbee-verify full to verify the application is working correctly" >> "$PROMPT"
          echo "2. If verification fails, fix the issues and re-verify" >> "$PROMPT"
          echo "Do not commit, push, or open a pull request — that is handled for you." >> "$PROMPT"
        fi

        # Output the prompt (multiline)
        {
          echo "prompt<<PROMPT_DELIM"
          cat "$PROMPT"
          echo "PROMPT_DELIM"
        } >> "$GITHUB_OUTPUT"

        if [ "${{ inputs.verbose }}" = "true" ]; then
          echo "::group::Verification prompt"
          cat "$PROMPT"
          echo "::endgroup::"
        fi

    # ── Configure git identity ────────────────────────────────────────
    - name: Configure git identity
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"

    # ── Install Claude Code CLI ─────────────────────────────────────
    - name: Install Claude Code CLI
      if: steps.plan.outputs.mode == 'local'
      shell: bash
      run: |
        # Resolve "latest" via `npm view` so the install pins to an explicit
        # version — same rationale as for @ironbee-ai/cli above.
        if [ "${{ inputs.claude_code_cli_version }}" = "latest" ]; then
          VERSION="$(npm view @anthropic-ai/claude-code version)"
        else
          VERSION="${{ inputs.claude_code_cli_version }}"
        fi
        echo "Installing @anthropic-ai/claude-code@${VERSION}"
        npm install -g "@anthropic-ai/claude-code@${VERSION}"
        echo "Installed @anthropic-ai/claude-code version: $(claude --version)"

    # ── Platform verification ──────────────────────────────────────────
    #
    # The application is started here only for a tunnel target: a deployed URL
    # was started by whoever deployed it. It runs in the background for the
    # length of the step, and is stopped by the teardown at the very end —
    # after the fix round and any re-verification, both of which still need it.
    - name: Start the application
      if: steps.plan.outputs.needs_app == 'true'
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      env:
        APP_INSTALL_COMMAND: ${{ inputs.app_install_command }}
        APP_BUILD_COMMAND: ${{ inputs.app_build_command }}
        APP_START_COMMAND: ${{ inputs.app_start_command }}
      run: |
        mkdir -p .ironbee/artifacts

        if [ -n "$APP_INSTALL_COMMAND" ]; then
          echo "::group::Installing application dependencies"
          bash -c "$APP_INSTALL_COMMAND"
          echo "::endgroup::"
        fi
        if [ -n "$APP_BUILD_COMMAND" ]; then
          echo "::group::Building the application"
          bash -c "$APP_BUILD_COMMAND"
          echo "::endgroup::"
        fi
        if [ -z "$APP_START_COMMAND" ]; then
          echo "::error::a tunnel target needs app_start_command to start the application"
          exit 1
        fi

        # Both streams to one file, because "the app never started" and "the app
        # answered 500" are the two failures a reader has to tell apart and the
        # verdict shows neither.
        nohup bash -c "$APP_START_COMMAND" > .ironbee/artifacts/app.log 2>&1 &
        echo $! > .ironbee/app.pid
        echo "Started the application (pid $(cat .ironbee/app.pid)); waiting for it happens in the CLI"

    - name: Run platform verification
      id: platform-verify
      if: steps.plan.outputs.mode == 'platform'
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      env:
        IRONBEE_API_KEY: ${{ inputs.ironbee_api_key }}
        API_URL_OVERRIDE: ${{ inputs.ironbee_api_url }}
        USER_PROMPT: ${{ inputs.prompt }}
        CLI_ARGS: ${{ steps.plan.outputs.cli_args }}
        INPUT_APP_SECRET_HEADERS: ${{ inputs.app_secret_headers }}
      run: |
        mkdir -p .ironbee/artifacts

        # Exported only when set. The CLI reads this variable before it reads
        # its own configuration, so an empty value would win over the endpoint
        # the user configured and point the run at nothing.
        if [ -n "$API_URL_OVERRIDE" ]; then
          export IRONBEE_API_URL="$API_URL_OVERRIDE"
        fi

        # One argument per line: an argument can contain a space — a project
        # name, a URL with one — and re-splitting a joined string is how such a
        # value silently becomes two arguments. Written as an `if` rather than
        # `[ -n "$line" ] && ARGS+=(…)`, whose status on the loop's last
        # (empty) line is 1 and would end the step under `set -e`.
        ARGS=()
        while IFS= read -r line; do
          if [ -n "$line" ]; then
            ARGS+=("$line")
          fi
        done <<< "$CLI_ARGS"

        # Emitted straight into this step rather than carried on a step output:
        # a step output is a file on the runner that outlives the step, and this
        # one carries the caller's secret.
        while IFS= read -r line; do
          if [ -n "$line" ]; then
            ARGS+=("$line")
          fi
        done < <(node "${{ github.action_path }}/scripts/resolve-plan.js" --secret-header-args)

        # Through a file, never a shell word: the prompt is caller text and a
        # command line is the one place it could become a command.
        if [ -n "$USER_PROMPT" ]; then
          printf '%s\n' "$USER_PROMPT" > .ironbee/prompt.txt
          ARGS+=("--prompt-file" ".ironbee/prompt.txt")
        fi

        set +e
        ironbee verify run web "${ARGS[@]}" > .ironbee/raw-output.txt
        EXIT_CODE=$?
        set -e

        # The CLI asks the runner to mask the tunnel credentials by writing
        # `::add-mask::` on stdout — the same stream `--json` writes the job to.
        # Redirected to a file, those lines would never reach the runner AND
        # would make the file unparseable, so they are re-emitted here and kept
        # out of the JSON. The CLI's own redactor already covered its own output
        # from the moment it registered them; this is the runner's copy.
        grep '^::add-mask::' .ironbee/raw-output.txt || true
        grep -v '^::add-mask::' .ironbee/raw-output.txt > .ironbee/artifacts/job.json || true

        # Never fails the step. The report, the outputs and the teardown all
        # have to run on whatever came back, and the recorded code is what the
        # gate step at the end exits with.
        echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
        echo "Verification command exited $EXIT_CODE"

    - name: Read the verification job
      id: job
      if: always() && steps.plan.outputs.mode == 'platform'
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      run: |
        node "${{ github.action_path }}/scripts/read-job.js" \
          .ironbee/artifacts/job.json "${{ inputs.ironbee_console_url }}"

    # ── Run Claude Code with IronBee ───────────────────────────────────
    - name: Run Claude Code verification
      id: claude-verify
      if: steps.plan.outputs.mode == 'local'
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      env:
        ANTHROPIC_API_KEY: ${{ inputs.anthropic_api_key }}
        CLAUDE_CODE_OAUTH_TOKEN: ${{ inputs.claude_code_oauth_token }}
        IRONBEE_API_KEY: ${{ inputs.ironbee_api_key }}
        PROMPT_CONTENT: ${{ steps.build-prompt.outputs.prompt }}
      run: |
        # Write prompt to file and pipe to claude
        PROMPT_FILE=$(mktemp)
        printf "%s" "$PROMPT_CONTENT" > "$PROMPT_FILE"

        # Run Claude Code with the verification prompt (stream output for live CI logs)
        LOG_FILE="$(pwd)/.ironbee/artifacts/claude-output.log"

        cat "$PROMPT_FILE" | claude --output-format stream-json --verbose \
          --max-turns ${{ inputs.max_turns }} \
          --dangerously-skip-permissions \
          ${{ inputs.model != '' && format('--model {0}', inputs.model) || '' }} \
          ${{ inputs.claude_args }} \
          2>&1 | tee "$LOG_FILE.raw" | jq -r --unbuffered --arg verbose "${{ inputs.verbose }}" '
            if .type == "assistant" and .message.content then
              (.message.content[] |
                if .type == "text" then "🤖 " + .text
                elif .type == "tool_use" then "🔧 " + .name + ": " + (.input | tostring | .[0:500])
                else empty end)
            elif .type == "user" and .message.content then
              (.message.content[] |
                if .type == "tool_result" then
                  (if .is_error then "❌ Error: " + (.content | tostring | .[0:500])
                   elif $verbose == "true" then "  ↳ " + (.content | tostring | .[0:500])
                   else empty end)
                else empty end)
            elif .type == "result" then
              "✅ Done (cost: $" + (.total_cost_usd // 0 | tostring) + ", turns: " + (.num_turns // 0 | tostring) + ")"
            else empty end
          ' 2>/dev/null | tee "$LOG_FILE" || true

        rm -f "$PROMPT_FILE"

    # ── Fix what the platform found ────────────────────────────────────
    #
    # A second, fix-only agent. It does not verify: a verdict already exists,
    # produced by a run with a browser and the application in front of it, and
    # asking this one to re-derive it from a text summary would get a worse
    # answer at full price. Local mode has no equivalent step — its agent
    # verifies and fixes inside one invocation.
    # Installed here rather than with the local one, and gated on the verdict:
    # a platform run that passes never pays for an agent it was not going to
    # use, which is most of what platform mode is for.
    - name: Install Claude Code CLI for the fix round
      if: steps.plan.outputs.mode == 'platform' && steps.plan.outputs.can_fix == 'true' && steps.job.outputs.verdict == 'fail'
      shell: bash
      run: |
        if [ "${{ inputs.claude_code_cli_version }}" = "latest" ]; then
          VERSION="$(npm view @anthropic-ai/claude-code version)"
        else
          VERSION="${{ inputs.claude_code_cli_version }}"
        fi
        echo "Installing @anthropic-ai/claude-code@${VERSION}"
        npm install -g "@anthropic-ai/claude-code@${VERSION}"
        echo "Installed @anthropic-ai/claude-code version: $(claude --version)"

    - name: Fix the reported issues
      id: platform-fix
      if: steps.plan.outputs.mode == 'platform' && steps.plan.outputs.can_fix == 'true' && steps.job.outputs.verdict == 'fail'
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      env:
        ANTHROPIC_API_KEY: ${{ inputs.anthropic_api_key }}
        CLAUDE_CODE_OAUTH_TOKEN: ${{ inputs.claude_code_oauth_token }}
        IRONBEE_PROMPT_NONCE: ${{ github.run_id }}-${{ github.run_attempt }}
      run: |
        PROMPT_FILE=.ironbee/fix-prompt.txt
        set +e
        node "${{ github.action_path }}/scripts/build-fix-prompt.js" \
          .ironbee/artifacts/job.json "$PROMPT_FILE" "${{ steps.job.outputs.job_url }}"
        BUILD_CODE=$?
        set -e

        # Exit 2 means the verdict carried no issues to work from. Not an error:
        # a failing verdict without issues is a report a person has to read.
        if [ "$BUILD_CODE" = "2" ]; then
          echo "::warning::the verdict reported no issues to fix"
          exit 0
        fi
        if [ "$BUILD_CODE" != "0" ]; then
          echo "::error::could not build the fix prompt"
          exit 1
        fi

        echo "::group::Fixing the reported issues"
        cat "$PROMPT_FILE" | claude --output-format stream-json --verbose \
          --max-turns 60 \
          --dangerously-skip-permissions \
          --strict-mcp-config --mcp-config '{"mcpServers":{}}' \
          2>&1 | tee .ironbee/claude-fix.log.raw | jq -r --unbuffered '
            if .type == "assistant" and .message.content then
              (.message.content[] |
                if .type == "text" then "🤖 " + .text
                elif .type == "tool_use" then "🔧 " + .name
                else empty end)
            elif .type == "result" then
              "✅ Fix round done (cost: $" + (.total_cost_usd // 0 | tostring) + ")"
            else empty end
          ' 2>/dev/null || true
        echo "::endgroup::"

        # `.ironbee` is excluded because this action writes into it — the job
        # body, the prompts, the logs. Counting those as "the agent changed
        # something" would report a fix on every run that produced none, and
        # then re-verify against unchanged code.
        if [ -n "$(git status --porcelain -- ':(exclude).ironbee')" ]; then
          echo "fixed=true" >> "$GITHUB_OUTPUT"
        else
          echo "fixed=false" >> "$GITHUB_OUTPUT"
          echo "::warning::the fix round changed no files"
        fi

    # A second verification, and only where it can mean anything. A tunnel
    # target serves the fixed code the moment the application restarts; a
    # deployed URL still serves what was deployed, so re-running against it
    # would verify the same bytes and report a result unrelated to the fix.
    - name: Re-verify after the fix
      id: platform-reverify
      if: steps.platform-fix.outputs.fixed == 'true' && steps.plan.outputs.needs_app == 'true'
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      env:
        IRONBEE_API_KEY: ${{ inputs.ironbee_api_key }}
        API_URL_OVERRIDE: ${{ inputs.ironbee_api_url }}
        CLI_ARGS: ${{ steps.plan.outputs.cli_args }}
        INPUT_APP_SECRET_HEADERS: ${{ inputs.app_secret_headers }}
        APP_START_COMMAND: ${{ inputs.app_start_command }}
      run: |
        if [ -n "$API_URL_OVERRIDE" ]; then
          export IRONBEE_API_URL="$API_URL_OVERRIDE"
        fi

        # The running application is the pre-fix code. Restarting it is what
        # makes the second run mean something.
        if [ -f .ironbee/app.pid ]; then
          kill "$(cat .ironbee/app.pid)" 2>/dev/null || true
          sleep 2
        fi
        nohup bash -c "$APP_START_COMMAND" >> .ironbee/artifacts/app.log 2>&1 &
        echo $! > .ironbee/app.pid

        ARGS=()
        while IFS= read -r line; do
          if [ -n "$line" ]; then
            ARGS+=("$line")
          fi
        done <<< "$CLI_ARGS"

        # Emitted straight into this step rather than carried on a step output:
        # a step output is a file on the runner that outlives the step, and this
        # one carries the caller's secret.
        while IFS= read -r line; do
          if [ -n "$line" ]; then
            ARGS+=("$line")
          fi
        done < <(node "${{ github.action_path }}/scripts/resolve-plan.js" --secret-header-args)

        set +e
        ironbee verify run web "${ARGS[@]}" > .ironbee/raw-output.txt
        EXIT_CODE=$?
        set -e

        grep '^::add-mask::' .ironbee/raw-output.txt || true
        grep -v '^::add-mask::' .ironbee/raw-output.txt > .ironbee/artifacts/job.json || true

        echo "exit_code=$EXIT_CODE" >> "$GITHUB_OUTPUT"
        echo "Re-verification exited $EXIT_CODE"

    - name: Read the re-verification job
      id: job-reverified
      if: steps.platform-reverify.conclusion == 'success'
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      run: |
        node "${{ github.action_path }}/scripts/read-job.js" \
          .ironbee/artifacts/job.json "${{ inputs.ironbee_console_url }}"

    # ── Discard IronBee-generated file changes ───────────────────────
    - name: Discard IronBee config changes
      if: always() && steps.plan.outputs.mode == 'local' && inputs.ironbee_exclude_files == 'true'
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      run: |
        # Revert tracked files modified by ironbee install
        git checkout -- .mcp.json .gitignore .claude/ .ironbee/config.json 2>/dev/null || true

    # ── Collect Evidence ───────────────────────────────────────────────
    - name: Extract verdict
      id: verdict
      if: always() && steps.plan.outputs.mode == 'local'
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      run: |
        STATUS="unknown"
        SESSION_ID=""

        # Prefer the most recently modified verdict.json (has both status and session_id)
        VERDICT_FILE=$(find .ironbee/sessions -name "verdict.json" -type f 2>/dev/null | xargs ls -t 2>/dev/null | head -1)
        if [ -n "$VERDICT_FILE" ] && [ -f "$VERDICT_FILE" ]; then
          STATUS=$(node -e "const v=JSON.parse(require('fs').readFileSync('$VERDICT_FILE','utf8'));console.log(v.status||'unknown')" 2>/dev/null || echo "unknown")
          SESSION_ID=$(basename "$(dirname "$VERDICT_FILE")")
          if [ "${{ inputs.verbose }}" = "true" ]; then
            echo "::group::Verdict details"
            cat "$VERDICT_FILE" | node -e "process.stdin.on('data',d=>console.log(JSON.stringify(JSON.parse(d),null,2)))" 2>/dev/null || cat "$VERDICT_FILE"
            echo "::endgroup::"
          fi
        fi

        # Fallback: derive status/session_id from the latest verdict_write event in actions.jsonl
        if [ -z "$SESSION_ID" ] || [ "$STATUS" = "unknown" ]; then
          ACTIONS_FILE=$(find .ironbee/sessions -name "actions.jsonl" -type f 2>/dev/null | xargs ls -t 2>/dev/null | head -1)
          if [ -n "$ACTIONS_FILE" ] && [ -f "$ACTIONS_FILE" ]; then
            EXTRACTED=$(ACTIONS_FILE="$ACTIONS_FILE" node -e "
              const lines=require('fs').readFileSync(process.env.ACTIONS_FILE,'utf8').split('\n').filter(Boolean);
              for (let i=lines.length-1;i>=0;i--) {
                try { const e=JSON.parse(lines[i]);
                  if (e.type==='verdict_write' && e.verdict) {
                    console.log((e.verdict.status||'unknown')+'|'+(e.session_id||''));
                    return;
                  }
                } catch {}
              }
            " 2>/dev/null || echo "")
            if [ -n "$EXTRACTED" ]; then
              [ "$STATUS" = "unknown" ] && STATUS="${EXTRACTED%%|*}"
              [ -z "$SESSION_ID" ] && SESSION_ID="${EXTRACTED##*|}"
            fi
          fi
        fi

        # Fallback: session_id from the final result event in claude-output.log.raw
        if [ -z "$SESSION_ID" ] && [ -f ".ironbee/artifacts/claude-output.log.raw" ]; then
          SESSION_ID=$(node -e "
            const lines=require('fs').readFileSync('.ironbee/artifacts/claude-output.log.raw','utf8').split('\n').filter(Boolean);
            for (let i=lines.length-1;i>=0;i--) {
              try { const e=JSON.parse(lines[i]); if (e.type==='result' && e.session_id) { console.log(e.session_id); return; } } catch {}
            }
          " 2>/dev/null || echo "")
        fi

        # Final fallback: any session directory under .ironbee/sessions/
        if [ -z "$SESSION_ID" ]; then
          SESSION_DIR=$(find .ironbee/sessions -maxdepth 1 -mindepth 1 -type d 2>/dev/null | head -1)
          [ -n "$SESSION_DIR" ] && SESSION_ID=$(basename "$SESSION_DIR")
        fi

        echo "status=$STATUS" >> "$GITHUB_OUTPUT"
        echo "session_id=$SESSION_ID" >> "$GITHUB_OUTPUT"
        echo "Verdict: $STATUS"
        echo "Session: ${SESSION_ID:-<none>}"

    - name: Collect session artifacts
      id: collect
      if: always() && steps.plan.outputs.mode == 'local'
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      run: |
        ARTIFACTS_DIR=".ironbee/artifacts"
        HAS_ARTIFACTS=false

        # Copy session logs to artifacts
        for session_dir in .ironbee/sessions/*/; do
          if [ -d "$session_dir" ]; then
            SESSION_ID=$(basename "$session_dir")
            mkdir -p "$ARTIFACTS_DIR/sessions/$SESSION_ID"
            cp -f "$session_dir"verdict.json "$ARTIFACTS_DIR/sessions/$SESSION_ID/" 2>/dev/null || true
            cp -f "$session_dir"actions.jsonl "$ARTIFACTS_DIR/sessions/$SESSION_ID/" 2>/dev/null || true
            HAS_ARTIFACTS=true
          fi
        done

        # Check for any cycle directories with evidence
        if [ -n "$(find "$ARTIFACTS_DIR" -maxdepth 1 -name 'cycle-*' -type d 2>/dev/null)" ]; then
          HAS_ARTIFACTS=true
        fi

        if [ "${{ inputs.verbose }}" = "true" ] && [ "$HAS_ARTIFACTS" = "true" ]; then
          echo "::group::Collected artifacts"
          find "$ARTIFACTS_DIR" -type f | sort
          echo "::endgroup::"
        fi

        echo "has_artifacts=$HAS_ARTIFACTS" >> "$GITHUB_OUTPUT"

    - name: Upload verification evidence
      id: upload-artifacts
      if: always() && steps.plan.outputs.mode == 'local' && steps.collect.outputs.has_artifacts == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: ironbee-verification-evidence
        path: ${{ inputs.working_directory }}/.ironbee/artifacts/
        retention-days: 30

    # ── The report ─────────────────────────────────────────────────────
    #
    # One body, two sources. A local run leaves artifacts behind and the report
    # is assembled from them; a platform run leaves a job body. The builder
    # shares the header, the badge and the footer between the two so a reader
    # sees one product rather than two tools that comment on the same PR.
    - name: Build the verification report
      id: report
      if: always() && steps.plan.outputs.mode != ''
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      run: |
        BODY_FILE="$(pwd)/.ironbee/report.md"
        mkdir -p .ironbee

        if [ "${{ steps.plan.outputs.mode }}" = "platform" ]; then
          node "${{ github.action_path }}/scripts/build-report.js" \
            --job .ironbee/artifacts/job.json \
            --version "${{ steps.install-cli.outputs.ironbee-version }}" \
            --console "${{ inputs.ironbee_console_url }}" \
            --job-url "${{ steps.job-reverified.outputs.job_url || steps.job.outputs.job_url }}" \
            --failure-code "${{ steps.job.outputs.failure_code }}" \
            > "$BODY_FILE"
        else
          node "${{ github.action_path }}/scripts/build-report.js" \
            ".ironbee/artifacts" \
            "${{ steps.install-cli.outputs.ironbee-version }}" \
            "${{ steps.upload-artifacts.outputs.artifact-url }}" \
            "${{ inputs.ironbee_console_url }}" \
            "${{ steps.verdict.outputs.session_id }}" \
            > "$BODY_FILE"
        fi

        echo "body_file=$BODY_FILE" >> "$GITHUB_OUTPUT"
        cat "$BODY_FILE" >> "$GITHUB_STEP_SUMMARY"

    - name: Post the report on the pull request
      if: always() && github.event_name == 'pull_request' && steps.report.outputs.body_file != ''
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        BODY_FILE: ${{ steps.report.outputs.body_file }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      run: |
        # Updated in place rather than appended to: a PR that is pushed to
        # repeatedly would otherwise collect one comment per run.
        EXISTING_COMMENT=$(gh api repos/${{ github.repository }}/issues/${PR_NUMBER}/comments \
          --paginate --jq '.[] | select(.body | contains("IronBee Verification Report")) | .id' | head -1)

        if [ -n "$EXISTING_COMMENT" ]; then
          gh api repos/${{ github.repository }}/issues/comments/$EXISTING_COMMENT \
            -X PATCH -F "body=@$BODY_FILE"
        else
          gh pr comment "$PR_NUMBER" --body-file "$BODY_FILE"
        fi

    # ── Land the fixes ─────────────────────────────────────────────────
    #
    # On a pull request the fix belongs on the PR's own branch. This is the path
    # that previously had no push step at all: the prompt asked the agent to
    # commit, and whether the commit was ever pushed depended on the agent
    # deciding to run `git push`.
    #
    # `actions/checkout` leaves a pull_request run on a detached merge commit
    # that belongs to no branch, so the push names the head ref explicitly.
    - name: Commit the fixes to the pull request branch
      if: >-
        always() && steps.plan.outputs.mode != '' &&
        github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.fork != true
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      env:
        HEAD_REF: ${{ github.event.pull_request.head.ref }}
      run: |
        git add -A
        # Always unstaged: this action's own working files. The rest only when
        # the caller asked for the IronBee setup to stay out of their commits.
        git reset HEAD -- .ironbee/ 2>/dev/null || true
        if [ "${{ inputs.ironbee_exclude_files }}" = "true" ]; then
          git reset HEAD -- .mcp.json .gitignore .claude/ 2>/dev/null || true
        fi

        if [ -z "$(git diff --cached --name-only)" ]; then
          echo "No fixes to commit"
          exit 0
        fi

        git commit -m "fix: apply IronBee verification fixes"

        # A push that cannot land fails the job even when the verification
        # passed, and deliberately: the fix exists only in this runner's
        # filesystem, and a green build over a fix nobody received is worse than
        # a red one that says why.
        if ! git push origin "HEAD:refs/heads/${HEAD_REF}"; then
          echo "::error::could not push the fixes to ${HEAD_REF} — the branch may have moved since this run checked it out"
          exit 1
        fi
        echo "Pushed the fixes to ${HEAD_REF}"

    # ── Fix PR for non-PR events ──────────────────────────────────────
    - name: Create fix PR
      if: >-
        always() && steps.plan.outputs.mode != '' &&
        github.event_name != 'pull_request'
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        BODY_FILE: ${{ steps.report.outputs.body_file }}
      run: |
        ORIGINAL_SHA="${{ github.sha }}"

        # Nothing to open a PR for when neither the agent nor the fix round
        # touched a file.
        # `.ironbee` excluded for the same reason as in the fix step: this
        # action's own working files are not the agent's changes.
        if [ "$ORIGINAL_SHA" = "$(git rev-parse HEAD)" ] \
           && [ -z "$(git status --porcelain -- ':(exclude).ironbee')" ]; then
          echo "No changes detected — verification passed or issues require manual review"
          exit 0
        fi

        SHORT_SHA=$(echo "$ORIGINAL_SHA" | cut -c1-7)
        BRANCH="ironbee/fix-${SHORT_SHA}-${GITHUB_RUN_ID}"

        git add -A
        if [ "${{ inputs.ironbee_exclude_files }}" = "true" ]; then
          git reset HEAD -- .mcp.json .gitignore .claude/ 2>/dev/null || true
        fi
        git reset HEAD -- .ironbee/ 2>/dev/null || true
        if [ -n "$(git diff --cached --name-only)" ]; then
          git commit -m "fix: apply IronBee verification fixes for ${SHORT_SHA}"
        fi

        if [ "$ORIGINAL_SHA" = "$(git rev-parse HEAD)" ]; then
          echo "No commits to push"
          exit 0
        fi

        # Move the fix commits onto their own branch and put the checkout back
        # where it started, so nothing here can be mistaken for a push to the
        # branch the run was triggered on.
        git branch "$BRANCH"
        git reset --hard "$ORIGINAL_SHA"
        git push origin "$BRANCH"

        if [ -n "$BODY_FILE" ] && [ -f "$BODY_FILE" ]; then
          gh pr create \
            --title "fix: IronBee verification fixes for ${SHORT_SHA}" \
            --body-file "$BODY_FILE" \
            --base "${{ github.ref_name }}" \
            --head "$BRANCH"
        else
          gh pr create \
            --title "fix: IronBee verification fixes for ${SHORT_SHA}" \
            --body "IronBee applied these fixes. The verification report is not available for this run." \
            --base "${{ github.ref_name }}" \
            --head "$BRANCH"
        fi

    # ── Teardown ───────────────────────────────────────────────────────
    #
    # After everything that could still need the application: the fix round and
    # the re-verification both run against it.
    - name: Stop the application
      if: always() && steps.plan.outputs.needs_app == 'true'
      shell: bash
      working-directory: ${{ inputs.working_directory }}
      run: |
        if [ -f .ironbee/app.pid ]; then
          kill "$(cat .ironbee/app.pid)" 2>/dev/null || true
          rm -f .ironbee/app.pid
        fi

    - name: Upload the application log
      if: always() && steps.plan.outputs.needs_app == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: ironbee-application-log
        path: ${{ inputs.working_directory }}/.ironbee/artifacts/app.log
        if-no-files-found: ignore
        retention-days: 30

    # ── The gate ───────────────────────────────────────────────────────
    #
    # The last step in the file, deliberately. The step that ran the
    # verification could not fail the job — the report, the outputs and the
    # teardown all had to run first — so the code it recorded is exited here,
    # after all of them.
    - name: Fail the job when the verification did
      if: always() && steps.plan.outputs.mode != ''
      shell: bash
      env:
        MODE: ${{ steps.plan.outputs.mode }}
        PLATFORM_CODE: ${{ steps.platform-reverify.outputs.exit_code || steps.platform-verify.outputs.exit_code }}
        LOCAL_VERDICT: ${{ steps.verdict.outputs.status }}
      run: |
        if [ "$MODE" = "platform" ]; then
          if [ -z "$PLATFORM_CODE" ]; then
            echo "::error::the verification did not run"
            exit 1
          fi
          if [ "$PLATFORM_CODE" != "0" ]; then
            echo "::error::verification did not pass (exit ${PLATFORM_CODE})"
          fi
          exit "$PLATFORM_CODE"
        fi

        # Local mode reads the verdict the agent wrote. `unknown` fails too: a
        # run that produced no verdict verified nothing, and treating "not fail"
        # as green turns an unverified change into a passing one.
        if [ "$LOCAL_VERDICT" = "pass" ]; then
          exit 0
        fi
        echo "::error::verification did not pass (verdict: ${LOCAL_VERDICT:-none})"
        exit 1
